repos:
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        name: black (py + ipynb)
        language_version: python3
        types_or: [python, jupyter]
        additional_dependencies:
          - black[jupyter]
  - repo: https://github.com/kynan/nbstripout
    rev: 0.7.1
    hooks:
      - id: nbstripout
